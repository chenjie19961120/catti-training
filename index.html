<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="CATTI 一级笔译练习应用，支持模块化练习、普通练习、参考译文、解析和 AI 问答。" />
    <title>一级笔译练习</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <p class="eyebrow">CATTI Level 1</p>
        <h1>一级笔译练习</h1>
        <p>只保留练习本身：选模块、做题、看多版本参考译文和解析，有问题就整理给 AI。</p>
      </header>

      <main>
        <nav class="mode-switch" aria-label="练习模式">
          <button id="moduleModeBtn" class="active" type="button">模块化练习</button>
          <button id="normalModeBtn" type="button">普通练习</button>
        </nav>

        <section id="modulePanel" class="panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">模块化练习</p>
              <h2>选择一个能力模块</h2>
            </div>
          </div>
          <div id="moduleGrid" class="module-grid"></div>
        </section>

        <section class="panel practice-panel">
          <div class="section-head">
            <div>
              <p id="practiceType" class="eyebrow">练习</p>
              <h2 id="practiceTitle">加载中</h2>
            </div>
            <span id="practiceTag" class="badge"></span>
          </div>

          <article class="prompt-card">
            <p class="label">题目</p>
            <p id="practicePrompt" class="prompt"></p>
          </article>

          <p id="practiceTask" class="task"></p>

          <label class="answer-box">
            我的答案
            <textarea id="answerInput" rows="8" placeholder="在这里作答。提交后会显示参考答案和解析。"></textarea>
          </label>

          <div class="actions">
            <button id="nextExerciseBtn" class="ghost-button" type="button">换一题</button>
            <button id="submitAnswerBtn" class="primary-button" type="button">看答案与解析</button>
          </div>
        </section>

        <section id="answerPanel" class="panel answer-panel" hidden>
          <div class="section-head">
            <div>
              <p class="eyebrow">参考与解析</p>
              <h2>对照你的答案</h2>
            </div>
          </div>
          <div id="referenceList" class="reference-list"></div>
          <article class="analysis-card">
            <p class="label">解析</p>
            <p id="analysisText"></p>
          </article>
        </section>

        <section class="panel ai-panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">问 AI</p>
              <h2>针对这道题提问</h2>
            </div>
          </div>
          <textarea id="aiQuestionInput" rows="4" placeholder="例如：我的译文哪里不自然？为什么这里不能直译？"></textarea>
          <div class="actions">
            <button id="copyAiPromptBtn" class="ghost-button" type="button">复制问题</button>
            <button id="askAiBtn" class="primary-button" type="button">发送给 AI</button>
          </div>
          <details class="ai-settings">
            <summary>AI 接口设置</summary>
            <label>
              后端接口地址
              <input id="aiEndpointInput" type="url" placeholder="例如：https://你的域名/api/ask" />
            </label>
            <button id="saveEndpointBtn" class="ghost-button" type="button">保存接口</button>
          </details>
          <div id="aiAnswer" class="ai-answer" hidden></div>
        </section>

        <section class="panel history-panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">练习历史</p>
              <h2>练过的题</h2>
            </div>
            <span id="historyCount" class="badge">0 条</span>
          </div>
          <div id="historyList" class="history-list"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
